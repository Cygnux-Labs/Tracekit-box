name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test -race ./...
      - run: make linux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python SDK tests
        run: cd sdk/python && python -m pip install -q pytest && python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install e2fsprogs and the Tracekit 1.4.2 signer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q e2fsprogs
          python3 -m pip install -q tracekit-ai==1.4.2
          tracekit init --dev --v2 --no-hooks
          tracekit up
      - run: make e2e
