# Release binaries. On a v* tag: build tkbox and tkbox-guest for linux/amd64 and linux/arm64 from the tag, after the
# same lint and unit tests as CI, write SHA256SUMS, attest each binary's build provenance (GitHub artifact
# attestations, verifiable with `gh attestation verify`) and publish them as the tag's GitHub Release.
# On a pull request that changes this file or the build, only the read-only build job runs, so the workflow is tested
# before a tag uses it. The job that can write (the release, the attestations) runs on tags only and never runs the
# repository's code: it checks the build job's checksums, then attests and publishes those exact files.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "Makefile", "go.mod", "go.sum"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false   # a release is built without a cache another run could have written
      - run: make lint
      - run: go test ./...
      - name: Build and checksum
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          make linux VERSION="$VERSION"
          cd bin
          sha256sum tkbox-linux-amd64 tkbox-linux-arm64 tkbox-guest-linux-amd64 tkbox-guest-linux-arm64 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the GitHub Release
      id-token: write     # the attestation's signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      - name: Check the binaries against the build's checksums
        run: cd bin && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: bin/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          Linux binaries of tkbox and its guest agent, built from $TAG by this repository's release workflow.

          Check a download against \`SHA256SUMS\` (\`sha256sum -c --ignore-missing SHA256SUMS\`) and its build provenance
          with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`. Install: the README's Install section.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md \
            bin/tkbox-linux-amd64 bin/tkbox-linux-arm64 bin/tkbox-guest-linux-amd64 bin/tkbox-guest-linux-arm64 \
            bin/SHA256SUMS
