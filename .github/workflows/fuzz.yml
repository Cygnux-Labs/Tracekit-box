name: fuzz
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to run each fuzz target (a Go duration)
        default: 60s
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run every fuzz target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '60s' }}
        # make expands the value it is given, so only a Go duration (60s, 1h30m) or a count (1000x) goes through.
        # -k: a failing target does not stop the rest, so every new failing input is collected below
        run: |
          [[ "$FUZZTIME" =~ ^([0-9]+(ms|s|m|h))+$|^[0-9]+x$ ]] \
            || { echo "::error::fuzztime must be a Go duration such as 60s or 1h30m, or a count such as 1000x"; exit 1; }
          make -k fuzz FUZZTIME="$FUZZTIME"
      # A failing input is written under its package's testdata/fuzz; keep only the new ones.
      - name: Collect new failing inputs
        if: failure()
        run: |
          mkdir -p fuzz-failures
          git ls-files -z --others --exclude-standard -- '*/testdata/fuzz/*' | xargs -0 -r cp --parents -t fuzz-failures
      - name: Upload new failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: fuzz-failures
          if-no-files-found: ignore
