name: runs
# Verified Runs (runs/) and Job Recipes (recipes/): every signed run must pass `tracekit verify`, and the table in the
# folder's README.md must be the one written from the verified records (`make runs`).
on:
  pull_request:
    paths:
      - "runs/**"
      - "recipes/**"
      - "cmd/tkbox-runs/**"
      - ".github/workflows/runs.yml"
  push:
    branches: [main]
    paths:
      - "runs/**"
      - "recipes/**"
      - "cmd/tkbox-runs/**"
      - ".github/workflows/runs.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Tracekit 1.4.2 CLI
        run: python -m pip install -q tracekit-ai==1.4.2
      # with tracekit on PATH, the tests also verify the committed runs and a tampered copy of one
      - run: go test ./cmd/tkbox-runs
      - name: Verify every run and check the tables
        run: |
          go run ./cmd/tkbox-runs -check runs
          if [ -d recipes ]; then go run ./cmd/tkbox-runs -check recipes; fi
