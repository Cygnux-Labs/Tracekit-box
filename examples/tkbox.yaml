# A box for a Python service's agent. Put this file at the repository root and run `tkbox run` from there: it reads
# ./tkbox.yaml when it exists (and says so). Reference: docs/config.md. Flags given to tkbox run override these values.

image: python:3.12-slim
name: service-agent

# The repository root: copied into /workspace (tracked and untracked-not-ignored files; never .git, never credential
# files such as .env or *.pem, even when they are not ignored). Changes come back only through tkbox diff / tkbox apply
# (after tkbox stop, before tkbox export). A patch that changes this file, .gitignore or .github/workflows/ is applied
# only with tkbox apply --allow-sensitive.
workspace: .

# Hosts the box may reach without asking. Anything else waits up to 2 minutes for `tkbox approve <id>` on the host.
allow:
  - pypi
  - github
  - anthropic

# The box sees placeholders in these variables; the host proxy swaps the real value in only on requests to `hosts`
# (exact names, no wildcards), and only in the one `header` (Authorization when left out). Values are read on the host when the box starts and
# never enter the VM. A secret's hosts join the allowlist.
secrets:
  ANTHROPIC_API_KEY:
    from_env: ANTHROPIC_API_KEY
    hosts: [api.anthropic.com]
    header: X-Api-Key
  GH_TOKEN:
    from_env: GH_TOKEN
    hosts: [api.github.com, github.com]
    header: Authorization

# Plain environment for every exec (visible in the box and recorded in the run: never secrets).
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: "1"

limits:
  cpus: 2
  memory: 4GiB        # writes outside /workspace (pip installs, /tmp) use this memory
  disk: 8GiB          # for writes to /workspace
  timeout: 1h         # the box's lifetime
  exec_timeout: 30m   # each command's

# bound: inspect (MITM) only hosts with a bound secret. all: every allowed HTTPS host, and hosts off the allowlist are
# refused at once (breaks certificate pinning).
inspect: bound
